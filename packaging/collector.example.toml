# ipv6-ra-logger collector configuration
state_dir      = "/var/lib/ra-logger"
listen_addr    = "[::]:547"
retention_days = 400

# One block per interface. Roles:
#   listen    - join ff02::1:2 and accept RFC 9686 registrations
#   responder - answer Information-Request with option 148 (only on links
#               with NO other DHCPv6 server; the router's RA needs the O flag)
#   sniff     - passive ND/RA sniffer: records MAC <-> address sightings and
#               routers from NDP traffic (Linux only; needs CAP_NET_RAW; puts
#               the interface in promiscuous mode). The interface may appear
#               after start-up; opening is retried with backoff.
#               Deployment: with MLD snooping on the switches an access port
#               misses most DAD and solicited-node traffic. On managed
#               networks use a SPAN/mirror port or a trunk.
[[interface]]
name  = "eth0"
roles = ["listen"]
# roles = ["listen", "responder"]   # responder ONLY if no other DHCPv6 server is on the link (see above)
# prefixes = ["2001:db8:10::/64"]   # optional; on-link prefixes are learned

[registrar]
allowed_prefixes = []   # required for direct unicast registrations; empty = deny
relay_prefixes   = []   # prefixes reachable through DHCPv6 relays
trusted_relays   = []   # source prefixes of DHCPv6 relay agents allowed to forward registrations; empty = accept no relayed registrations

# Sniffer tuning (only used by interfaces with the "sniff" role). Every key
# is optional; the values shown are the defaults.
# [sniffer]
# idle_timeout    = "24h"   # min "1m". A sighting not seen for this long is expired and an nd.expire event is logged.
# log_link_local  = false   # false: link-local (fe80::/10) sightings go to the database only, with no nd.* events.
# proxy_threshold = 32      # min 2. A MAC seen with MORE than this many addresses on one link+VLAN is marked
#                           # proxy_suspect (a proxy-ND router, say): it gets no further nd.* events and is
#                           # ignored by the hosts view and the registrar's MAC lookup. Its sightings are still stored.
# max_entries     = 100000  # min 100. Cap on live (MAC, address, link, VLAN) sightings held in memory. Beyond it
#                           # new sightings are dropped and counted in the stats counter sniff_overflow; while
#                           # it is full, genuine new hosts are dropped too, until flooded entries expire
#                           # (idle_timeout).
# max_routers     = 1000    # min 10. Cap on routers (link, VLAN, MAC, link-local address) tracked from RAs. Beyond
#                           # it RAs from new routers are dropped (no row, no event) and counted in ra_overflow.
#                           # Routers not seen for idle_timeout are dropped from memory without an event (their
#                           # rows stay until retention_days); only routers seen within idle_timeout are loaded
#                           # at start-up.
#
# Not configurable:
# - nd.new/nd.conflict events are capped at 20/s (burst 200). Over the cap the
#   sighting is still stored but no event is logged (stats counter
#   nd_suppressed). nd.expire is never capped, but is only logged for
#   sightings whose nd.new/nd.conflict was logged.
# - ra.seen/ra.change events are capped at 2/s (burst 50). Over the cap the
#   router row is still written but no event is logged (ra_suppressed).
# - Repeat sightings and RAs update last_seen in the database at most every
#   5 minutes (and on a clean shutdown); they never produce syslog lines.

[vendor]
enterprise_number = 32473   # RFC 5612 documentation PEN - replace before production

[log]
facility = "local5"

[[log.output]]
type    = "unix"
address = "/dev/log"

