# /etc/rsyslog.d/30-slaac-logger.conf
# Parses slaac-logger's @cee: JSON and writes one JSON object per line.
module(load="mmjsonparse")

template(name="slaac_logger_json" type="list") {
  property(name="$!all-json")
  constant(value="\n")
}

# Lines that are not valid @cee: JSON are kept verbatim, not lost.
template(name="slaac_logger_raw" type="list") {
  property(name="rawmsg")
  constant(value="\n")
}

if $programname == "slaac-logger" then {
  action(type="mmjsonparse" cookie="@cee:")
  if $parsesuccess == "OK" then {
    action(type="omfile" file="/var/log/slaac-logger/events.json" template="slaac_logger_json")
  } else {
    action(type="omfile" file="/var/log/slaac-logger/unparsed.log" template="slaac_logger_raw")
  }
  # Forward to a SIEM or central rsyslog over TLS:
  # action(type="omfwd" target="siem.example.net" port="6514" protocol="tcp"
  #        StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name")
  stop
}
