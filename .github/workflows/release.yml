name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create GitHub releases and upload assets

jobs:
  build:
    name: build ${{ matrix.binary }} (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # agent: Linux, macOS, Windows
          - { binary: agent,     goos: linux,   goarch: amd64 }
          - { binary: agent,     goos: linux,   goarch: arm64 }
          - { binary: agent,     goos: darwin,  goarch: amd64 }
          - { binary: agent,     goos: darwin,  goarch: arm64 }
          - { binary: agent,     goos: windows, goarch: amd64 }
          - { binary: agent,     goos: windows, goarch: arm64 }
          # collector: Linux and macOS only (//go:build !windows)
          - { binary: collector, goos: linux,   goarch: amd64 }
          - { binary: collector, goos: linux,   goarch: arm64 }
          - { binary: collector, goos: darwin,  goarch: amd64 }
          - { binary: collector, goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="slaac-logger-${{ matrix.binary }}-${version}-$GOOS-$GOARCH${ext}"
          go build \
            -ldflags "-X main.version=${version}" \
            -trimpath \
            -o "$out" \
            ./cmd/${{ matrix.binary }}
          echo "out=$out" >> "$GITHUB_OUTPUT"
        id: build

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          base="slaac-logger-${{ matrix.binary }}-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="${base}.zip"
            zip "$archive" "${base}.exe"
          else
            archive="${base}.tar.gz"
            tar -czf "$archive" "${base}"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/*
