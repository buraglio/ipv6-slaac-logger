name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Short fuzz run of every Fuzz target
        run: |
          set -euo pipefail
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              go test -run='^$' -fuzz="^${target}\$" -fuzztime=20s "$pkg"
            done
          done

  e2e-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Install radvd
        run: sudo apt-get update && sudo apt-get install -y radvd
      - name: Build static binaries and the e2e test
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/collector ./cmd/collector
          CGO_ENABLED=0 go build -o bin/regsend ./cmd/regsend
          CGO_ENABLED=0 go build -o bin/agent ./cmd/agent
          go test -c -tags e2e -o bin/e2e.test ./test/e2e
      - name: Run end-to-end tests in network namespaces
        run: sudo RAL_BIN_DIR="$PWD/bin" ./bin/e2e.test -test.v -test.timeout=5m

  interop-kea:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Install radvd
        run: sudo apt-get update && sudo apt-get install -y radvd
      # Kea 3.0 from ISC's Cloudsmith "kea-3-0" repository, added explicitly
      # instead of piping ISC's setup script into bash. See
      # https://kea.readthedocs.io/en/latest/arm/install.html#installation-from-packages
      # and https://cloudsmith.io/~isc/repos/kea-3-0/setup/. The package
      # isc-kea-dhcp6 is listed in ISC's install docs (the systemd service is
      # named isc-kea-dhcp6-server, the package is not).
      - name: Install Kea 3.0 (ISC Cloudsmith repository)
        run: |
          set -euo pipefail
          curl -1sLf https://dl.cloudsmith.io/public/isc/kea-3-0/gpg.B16C44CD45514C3C.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/isc-kea-3-0-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/isc-kea-3-0-archive-keyring.gpg] https://dl.cloudsmith.io/public/isc/kea-3-0/deb/ubuntu $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/isc-kea-3-0.list
          sudo apt-get update
          sudo apt-get install -y isc-kea-dhcp6
          command -v kea-dhcp6 || ls /usr/sbin | grep -i kea
      - name: Build the agent and the interop test
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/agent ./cmd/agent
          go test -c -tags e2e,interop -o bin/e2e.test ./test/e2e
      - name: Run the Kea interop test in network namespaces
        run: sudo env "PATH=$PATH:/usr/sbin" RAL_BIN_DIR="$PWD/bin" ./bin/e2e.test -test.v -test.run TestAgentKeaInterop -test.timeout=5m
